[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
